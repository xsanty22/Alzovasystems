  <!-- Pata izquierda azul (parte baja) -->
  <path d="M 100 100 L 60 200 L 90 200 L 100 172 Z" fill="url(#blueGrad)"/>

  <!-- Pata derecha azul (parte baja) -->
  <path d="M 100 100 L 140 200 L 110 200 L 100 172 Z" fill="url(#blueGrad)"/>
</svg>